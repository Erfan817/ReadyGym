name: ReadyGym tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android app + core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'server/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: app + core unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :core:test --no-daemon --console=plain

  server:
    name: Spring Boot unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-server-${{ hashFiles('server/**/*.gradle*', 'server/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-server-
      - name: server tests
        working-directory: server
        run: ./gradlew test --no-daemon --console=plain
