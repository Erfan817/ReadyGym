name: ReadyGym tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android app + core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Use the Android SDK preinstalled on the runner image instead of
      # android-actions/setup-android, which still targets Node 20 and breaks
      # once the runner forces it onto Node 24.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'server/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: app + core unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :core:test --no-daemon --console=plain

  server:
    name: Spring Boot unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-server-${{ hashFiles('server/**/*.gradle*', 'server/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-server-
      - name: server tests
        working-directory: server
        run: ./gradlew test --no-daemon --console=plain
