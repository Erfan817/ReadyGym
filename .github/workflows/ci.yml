name: ReadyGym tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  android:
    name: Android app + core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Use the Android SDK preinstalled on the runner image instead of
      # android-actions/setup-android, which still targets Node 20 and breaks
      # once the runner forces it onto Node 24.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'server/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: app + core unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :core:test --no-daemon --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-android.log"

      # Temporary diagnostic: stash the failure detail on a side branch so it can
      # be read without access to the Actions log storage.
      - name: Publish failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ci-diag
          {
            echo "exit: android job failed"
            echo "=== gradle tail ==="
            tail -c 15000 gradle-android.log 2>/dev/null || echo "(no log)"
            echo
            echo "=== distinct test failure messages ==="
            grep -rho 'message="[^"]\{0,400\}"' android/app/build/test-results 2>/dev/null \
              | sort -u | head -30 || echo "(none)"
            echo
            echo "=== first test stack trace ==="
            grep -rho 'java.lang[^<]\{0,600\}' android/app/build/test-results 2>/dev/null \
              | head -20 || echo "(none)"
          } > ci-diag/android.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-diag
          git commit -m "ci diagnostics: android job" || true
          git push -f origin HEAD:refs/heads/ci-diag

  server:
    name: Spring Boot unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-server-${{ hashFiles('server/**/*.gradle*', 'server/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-server-
      - name: server tests
        working-directory: server
        run: ./gradlew test --no-daemon --console=plain
