org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.builder.sdkDownload=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The ReadyGym backend this build talks to (REDACTED_PORT is the NAT-forwarded public port -> 8080 on the
# VPS; see docs/deploy-vps.md). Override with -PreadyGymServiceBaseUrl=... for local development,
# e.g. http://10.0.2.2:8080 for a server booted on the dev machine (emulator default).
readyGymServiceBaseUrl=http://REDACTED_HOST:REDACTED_PORT
