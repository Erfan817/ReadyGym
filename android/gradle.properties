org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.builder.sdkDownload=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The ReadyGym backend this build talks to. The release server sits behind a provider NAT that
# forwards a high public port to 8080 on the VPS (see docs/deploy-vps.md); the exact host and port
# are supplied per-machine via -PreadyGymServiceBaseUrl=... and are not committed to the repo.
# For local development point at http://10.0.2.2:8080 (a server booted on the dev machine, which
# is the emulator default). Example: ./gradlew -PreadyGymServiceBaseUrl=http://<host>:<port> ...
readyGymServiceBaseUrl=http://10.0.2.2:8080
